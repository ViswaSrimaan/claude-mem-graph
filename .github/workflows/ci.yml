name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Check cowork/ is up to date with plugin/
        run: |
          npm run build
          git diff --exit-code -- cowork/ || { echo "::error::cowork/ is out of date. Run npm run build and commit the result."; exit 1; }
