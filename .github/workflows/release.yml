name: Release

# Push a version tag (e.g. v1.1.0) to build the plugin zips and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the tag matches every version field
        run: |
          node -e '
            const fs = require("fs");
            const want = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const read = (f) => JSON.parse(fs.readFileSync(f, "utf8"));
            const found = {
              "package.json": read("package.json").version,
              "plugin/.claude-plugin/plugin.json": read("plugin/.claude-plugin/plugin.json").version,
              "cowork/.claude-plugin/plugin.json": read("cowork/.claude-plugin/plugin.json").version,
              ...Object.fromEntries(read(".claude-plugin/marketplace.json").plugins.map((p) => ["marketplace.json " + p.name, p.version])),
            };
            const bad = Object.entries(found).filter(([, v]) => v !== want);
            if (bad.length) { console.error("Tag " + want + " does not match: " + bad.map(([f, v]) => f + "=" + v).join(", ")); process.exit(1); }
          '
      - run: npm test
      - run: npm run package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/mem-local.zip dist/mem-local-cowork.zip --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
